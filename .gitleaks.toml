# Incorporeal secret-scan config.
#
# Gitleaks extends its embedded default rule set (useDefault) and adds one
# narrowly scoped synthetic canary rule used ONLY by the controlled canary
# step. The canary prefix (incorporeal_canary_) is unknown to GitHub secret
# scanning, so committing the fixture does not trip push protection; it is
# still reliably flagged by this rule, proving the scanner path works end
# to end. The fixture path below is allowlisted for the main tree scan, and
# the canary step scans a copy outside that path, so detection is proven
# while normal scans stay green.
#
# Suppression policy: do not add blanket exclusions (e.g. whole src/ or file
# types). New suppressions need a comment with the reason.
title = "Incorporeal secret scan"

[extend]
useDefault = true

# Synthetic canary rule: high confidence by prefix, no entropy gate, so the
# runtime-generated canary is deterministically detected. Never use this
# prefix for real credentials.
[[rules]]
id = "incorporeal-canary"
description = "Synthetic canary for controlled CI test (not a real credential)."
regex = '''incorporeal_canary_[A-Za-z0-9]{32}'''
keywords = ["incorporeal_canary_"]

# Controlled fixture directory: committed canary content would otherwise fail
# the main tree scan on every PR. The canary CI step copies the fixture to a
# temp dir (outside this path) and scans it WITHOUT this allowlist matching,
# so detection is still proven while normal scans stay green.
[[allowlists]]
description = "Controlled canary fixture (scanned in isolation by the canary step)."
paths = ['''test/fixtures/secret-scan/.*''']
# Superseded inline canary: before 7f10f7b the workflow generated the canary
# with an inline echo, so these two trees contain the synthetic value. The
# value was moved to the controlled fixture above; it was never a real
# credential (unknown prefix, committed openly), so history keeps the string
# and the allowlist pins the exact commits. Never add a real leaked
# credential here — real leaks must be revoked/rotated first (see
# SECURITY.md). Precedent: Wrangnarok's historic-docs allowlist.
commits = ['''882f08f8fa9ee9352aa74fb5c8e7d7216c493221''', '''6023a543f67337ea069e4bad0962d7fb085e0153''']
